services:
  api:
    image: maven:3.9.6-eclipse-temurin-17
    working_dir: /app
    command: >
      mvn -B -DskipTests
          -Dspring-boot.run.profiles=dev
          -Dspring-boot.run.mainClass=com.shelfie.ApiShelfieApplication
          spring-boot:run
    ports:
      - "8081:8080"
    environment:
      SPRING_DATASOURCE_URL: ${SPRING_DATASOURCE_URL}
      SPRING_DATASOURCE_USERNAME: ${SPRING_DATASOURCE_USERNAME}
      SPRING_DATASOURCE_PASSWORD: ${SPRING_DATASOURCE_PASSWORD}
      SPRING_JPA_HIBERNATE_DDL_AUTO: update
      JAVA_TOOL_OPTIONS: "-Dspring.devtools.restart.poll-interval=1s -Dspring.devtools.restart.quiet-period=300ms"
      SECURITY_JWT_SECRET: ${SECURITY_JWT_SECRET}
    volumes:
      - .:/app
      - ~/.m2:/root/.m2
      # Masquer target et .git côté conteneur (évite les rebuild en boucle)
      - /app/target
      - /app/.git
    depends_on:
      db:
        condition: service_healthy
    #restart: unless-stopped

  db:
    image: postgres:15
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 3s
      timeout: 3s
      retries: 20

volumes:
  db_data: