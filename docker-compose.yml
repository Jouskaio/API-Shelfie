version: '3.8'

services:
  app:
    build: .
    ports:
      - "8080:8080"
    environment:
      - SPRING_PROFILES_ACTIVE=docker
      - SPRING_DATASOURCE_URL=jdbc:postgresql://db:5432/shelfie
      - SPRING_DATASOURCE_USERNAME=shelfie
      - SPRING_DATASOURCE_PASSWORD=password
    depends_on:
      - db
    networks:
      - shelfie-network

  db:
    image: postgres:15
    environment:
      - POSTGRES_DB=shelfie
      - POSTGRES_USER=shelfie
      - POSTGRES_PASSWORD=password
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - shelfie-network

volumes:
  postgres_data:

networks:
  shelfie-network:
    driver: bridge